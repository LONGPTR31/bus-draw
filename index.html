<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東湖交通車座位抽籤系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    // 帶入您的真實 Firebase 金鑰
    const firebaseConfig = {
      apiKey: "AIzaSyDl1q7RLHwyuJT42iBT6815zRBkTgBCy40",
      authDomain: "bus-seat-draw.firebaseapp.com",
      projectId: "bus-seat-draw",
      storageBucket: "bus-seat-draw.firebasestorage.app",
      messagingSenderId: "272780096803",
      appId: "1:272780096803:web:6c1d45601b0f7299920896",
      measurementId: "G-K4QEHJSSNL"
    };

    // 初始化 Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const SEAT_LAYOUT = [
      { type: 'header' },
      { row: 1, seats: [{ id: '1-1' }, { id: '1-3' }, { id: 'driver_seat', type: 'driver', label: '車長' }] },
      { row: 2, seats: [{ id: '2-1' }, { id: '2-3' }, { id: '2-4' }, { id: '2-2' }] },
      { row: 3, seats: [{ id: '3-1' }, { id: '3-3' }, { id: '3-4' }, { id: '3-2' }] },
      { row: 4, seats: [{ id: '4-1' }, { id: '4-3' }, { id: '4-4' }, { id: '4-2' }] },
      { row: 5, seats: [{ id: '5-1' }, { id: '5-3' }, { id: '5-4' }, { id: '5-2' }] },
      { row: 6, seats: [{ id: '6-1' }, { id: '6-3' }, { id: '6-4' }, { id: '6-2' }] },
      { row: 7, seats: [{ id: '7-1', type: 'reserved', label: '7-1\n值班人員' }, { id: '7-3', type: 'reserved', label: '7-3\n值班人員' }, { id: '7-4' }, { id: '7-2' }] },
      { row: 8, seats: [{ id: '8-1', type: 'reserved', label: '8-1\n值班人員' }, { id: '8-3', type: 'reserved', label: '8-3\n值班人員' }, { id: '8-4' }, { id: '8-2' }] },
      { row: 9, seats: [{ id: 'safety_door', type: 'safety', label: '安全門' }, { id: '9-4' }, { id: '9-2' }] },
      { row: 10, seats: [{ id: '10-4' }, { id: '10-2' }] },
      { row: 11, seats: [{ id: '11-1', type: 'free', label: '11-1\n自由座' }, { id: '11-3', type: 'free', label: '11-3\n自由座' }, { id: '11-4', type: 'free', label: '11-4\n自由座' }, { id: '11-2', type: 'free', label: '11-2\n自由座' }] }
    ];

    const DRAWABLE_SEATS = [
      '1-1', '1-3',
      '2-1', '2-3', '2-4', '2-2',
      '3-1', '3-3', '3-4', '3-2',
      '4-1', '4-3', '4-4', '4-2',
      '5-1', '5-3', '5-4', '5-2',
      '6-1', '6-3', '6-4', '6-2',
      '7-4', '7-2',
      '8-4', '8-2',
      '9-4', '9-2',
      '10-4', '10-2'
    ];

    function App() {
      const [name, setName] = React.useState('');
      const [assignedSeats, setAssignedSeats] = React.useState({});
      const [currentUser, setCurrentUser] = React.useState(null);
      const [isDrawing, setIsDrawing] = React.useState(false);
      const [animatingSeat, setAnimatingSeat] = React.useState('');
      const [showAdmin, setShowAdmin] = React.useState(false);
      const [adminPassword, setAdminPassword] = React.useState('');
      const [isAdmin, setIsAdmin] = React.useState(false);

      React.useEffect(() => {
        const unsubscribe = db.collection('seats').onSnapshot(snapshot => {
          const seatsData = {};
          snapshot.forEach(doc => {
            seatsData[doc.id] = doc.data().passengerName;
          });
          setAssignedSeats(seatsData);
        });
        const savedUser = localStorage.getItem('bus_passenger_name');
        if (savedUser) setCurrentUser(savedUser);
        return () => unsubscribe();
      }, []);

      const mySeat = currentUser ? Object.keys(assignedSeats).find(seat => assignedSeats[seat] === currentUser) : null;

      const handleDraw = async () => {
        if (!name.trim()) return alert('請輸入您的姓名！');
        const trimmedName = name.trim();
        const existingSeat = Object.keys(assignedSeats).find(seat => assignedSeats[seat] === trimmedName);
        if (existingSeat) {
          setCurrentUser(trimmedName);
          localStorage.setItem('bus_passenger_name', trimmedName);
          return alert(`您已經抽過座位了，您的座位是：${existingSeat}`);
        }

        const occupiedSeats = Object.keys(assignedSeats);
        const availableSeats = DRAWABLE_SEATS.filter(seat => !occupiedSeats.includes(seat));
        if (availableSeats.length === 0) return alert('抱歉，交通車所有可抽座位均已額滿！');

        setIsDrawing(true);
        let counter = 0;
        const interval = setInterval(() => {
          const tempSeat = availableSeats[Math.floor(Math.random() * availableSeats.length)];
          setAnimatingSeat(tempSeat);
          counter++;
          if (counter > 15) {
            clearInterval(interval);
            const finalSeat = availableSeats[Math.floor(Math.random() * availableSeats.length)];
            db.collection('seats').doc(finalSeat).set({ passengerName: trimmedName })
              .then(() => {
                setCurrentUser(trimmedName);
                localStorage.setItem('bus_passenger_name', trimmedName);
                setIsDrawing(false);
                setAnimatingSeat('');
              })
              .catch(err => {
                alert('抽籤發生錯誤，請重試！');
                setIsDrawing(false);
              });
          }
        }, 100);
      };

      const handleAdminLogin = () => {
        if (adminPassword === '1234') {
          setIsAdmin(true);
        } else {
          alert('密碼錯誤！');
        }
      };

      // 刪除單一座位紀錄
      const handleDeleteSeat = (seatId, passengerName) => {
        if (!isAdmin) return;
        if (confirm(`【管理員操作】\n確定要刪除座位 ${seatId} (${passengerName}) 的劃位紀錄嗎？`)) {
          db.collection('seats').doc(seatId).delete()
            .then(() => alert(`已成功清除座位 ${seatId}！`))
            .catch(err => alert('刪除失敗，請重試！'));
        }
      };

      const handleReset = async () => {
        if (confirm('【管理員操作】\n確定要清空「東湖交通車」所有抽籤紀錄嗎？此動作無法復原！')) {
          const snapshot = await db.collection('seats').get();
          const batch = db.batch();
          snapshot.docs.forEach(doc => batch.delete(doc.ref));
          await batch.commit();
          alert('東湖交通車所有座位紀錄已清空！');
        }
      };

      return (
        <div className="max-w-md mx-auto p-4 pb-20">
          <header className="text-center mb-6 bg-white p-4 rounded-xl shadow-md">
            <h1 className="text-2xl font-bold text-slate-800">🚌 東湖交通車座位抽籤</h1>
            <button 
              onClick={() => setShowAdmin(!showAdmin)}
              className="text-xs text-slate-400 mt-2 underline"
            >
              {showAdmin ? '關閉管理後台' : '管理員入口'}
            </button>
          </header>

          {showAdmin && (
            <div className="bg-amber-50 border border-amber-200 p-4 rounded-xl mb-6">
              {!isAdmin ? (
                <div className="flex gap-2">
                  <input 
                    type="password" 
                    placeholder="輸入後台密碼 (預設1234)" 
                    value={adminPassword} 
                    onChange={e => setAdminPassword(e.target.value)}
                    className="p-2 text-sm border rounded flex-1"
                  />
                  <button onClick={handleAdminLogin} className="bg-amber-600 text-white px-3 text-sm rounded">登入</button>
                </div>
              ) : (
                <div>
                  <div className="flex justify-between items-center mb-2">
                    <h3 className="font-bold text-amber-900">管理員模式已啟用</h3>
                    <span className="text-xs text-amber-700 bg-amber-200 px-2 py-0.5 rounded">點擊已劃位座位可單獨刪除</span>
                  </div>
                  <button onClick={handleReset} className="w-full bg-red-500 hover:bg-red-600 text-white text-xs py-2 rounded font-bold">
                    清空重置東湖交通車所有座位
                  </button>
                </div>
              )}
            </div>
          )}

          {!mySeat ? (
            <div className="bg-white p-4 rounded-xl shadow-md mb-6">
              <label className="block text-sm font-medium text-slate-700 mb-2">請輸入您的姓名抽東湖交通車座位：</label>
              <div className="flex gap-2">
                <input 
                  type="text" 
                  value={name} 
                  onChange={e => setName(e.target.value)} 
                  placeholder="例如：張小明"
                  disabled={isDrawing}
                  className="flex-1 p-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                <button 
                  onClick={handleDraw} 
                  disabled={isDrawing}
                  className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg font-bold disabled:bg-slate-300"
                >
                  {isDrawing ? '抽籤中...' : '開始抽籤'}
                </button>
              </div>
            </div>
          ) : (
            <div className="bg-emerald-500 text-white p-4 rounded-xl shadow-md mb-6 text-center">
              <p className="text-sm">恭喜！{currentUser}</p>
              <p className="text-2xl font-black mt-1">您的東湖交通車座位：{mySeat}</p>
            </div>
          )}

          {/* 車體地圖 */}
          <div className="bg-white p-4 rounded-2xl shadow-xl border-2 border-slate-300">
            <div className="flex justify-between items-center bg-slate-800 text-white py-2 px-4 rounded-lg mb-4 text-center font-bold">
              <span>司機駕駛 🚘</span>
              <span>車門 🚪</span>
            </div>

            <div className="space-y-2">
              {SEAT_LAYOUT.slice(1).map((row) => {
                if (row.row === 9) {
                  return (
                    <div key="row-9-10" className="flex gap-2 items-center">
                      <div className="w-1/2 h-24 bg-amber-100 border-2 border-amber-400 rounded-lg flex items-center justify-center font-bold text-amber-800 text-center text-sm">
                        🚨 安全門
                      </div>
                      <div className="w-1/2 space-y-2">
                        <div className="flex gap-1 justify-end">
                          <SeatBox id="9-4" name={assignedSeats['9-4']} isAnim={animatingSeat === '9-4'} mySeat={mySeat} isAdmin={isAdmin} onDelete={handleDeleteSeat} />
                          <SeatBox id="9-2" name={assignedSeats['9-2']} isAnim={animatingSeat === '9-2'} mySeat={mySeat} isAdmin={isAdmin} onDelete={handleDeleteSeat} />
                        </div>
                        <div className="flex gap-1 justify-end">
                          <SeatBox id="10-4" name={assignedSeats['10-4']} isAnim={animatingSeat === '10-4'} mySeat={mySeat} isAdmin={isAdmin} onDelete={handleDeleteSeat} />
                          <SeatBox id="10-2" name={assignedSeats['10-2']} isAnim={animatingSeat === '10-2'} mySeat={mySeat} isAdmin={isAdmin} onDelete={handleDeleteSeat} />
                        </div>
                      </div>
                    </div>
                  );
                }
                if (row.row === 10) return null;

                return (
                  <div key={row.row} className="flex justify-between gap-2">
                    <div className="flex gap-1 w-[48%]">
                      {row.seats.slice(0, 2).map(s => (
                        <SeatBox key={s.id} {...s} name={assignedSeats[s.id]} isAnim={animatingSeat === s.id} mySeat={mySeat} isAdmin={isAdmin} onDelete={handleDeleteSeat} />
                      ))}
                    </div>
                    <div className="flex gap-1 w-[48%] justify-end">
                      {row.seats.slice(2).map(s => (
                        <SeatBox key={s.id} {...s} name={assignedSeats[s.id]} isAnim={animatingSeat === s.id} mySeat={mySeat} isAdmin={isAdmin} onDelete={handleDeleteSeat} />
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    function SeatBox({ id, type, label, name, isAnim, mySeat, isAdmin, onDelete }) {
      if (type === 'driver') {
        return <div className="w-full h-12 bg-gray-200 border rounded flex items-center justify-center text-xs font-bold text-gray-600">{label}</div>;
      }
      if (type === 'reserved') {
        return <div className="flex-1 h-12 bg-slate-200 border border-slate-300 rounded flex items-center justify-center text-[10px] text-center font-bold text-slate-500 whitespace-pre-line">{label}</div>;
      }
      if (type === 'free') {
        return <div className="flex-1 h-12 bg-blue-50 border border-blue-200 rounded flex items-center justify-center text-[10px] text-center font-bold text-blue-500 whitespace-pre-line">{label}</div>;
      }

      const isMine = mySeat === id;
      const isTaken = !!name;

      let style = "bg-emerald-50 border-emerald-300 text-emerald-800";
      if (isAnim) style = "bg-yellow-300 border-yellow-500 scale-105 shadow-md";
      else if (isMine) style = "bg-emerald-500 border-emerald-600 text-white font-bold ring-2 ring-emerald-300";
      else if (isTaken) {
        style = isAdmin 
          ? "bg-amber-100 border-amber-400 text-amber-900 cursor-pointer hover:bg-red-100 hover:border-red-400 hover:text-red-700 transition-colors" 
          : "bg-slate-300 border-slate-400 text-slate-600";
      }

      const handleClick = () => {
        if (isAdmin && isTaken) {
          onDelete(id, name);
        }
      };

      return (
        <div 
          onClick={handleClick}
          title={isAdmin && isTaken ? "點擊刪除此座位劃位" : ""}
          className={`flex-1 h-12 border rounded flex flex-col items-center justify-center text-xs transition-all ${style}`}
        >
          <span className="font-semibold">{id}</span>
          <span className="text-[10px] truncate max-w-full px-1">
            {name || '可抽'}
            {isAdmin && isTaken && <span className="text-[8px] block text-red-500">❌ 刪除</span>}
          </span>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
