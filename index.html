<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交通車座位抽籤系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    // 帶入您的真實 Firebase 金鑰
    const firebaseConfig = {
      apiKey: "AIzaSyDl1q7RLHwyuJT42iBT6815zRBkTgBCy40",
      authDomain: "bus-seat-draw.firebaseapp.com",
      projectId: "bus-seat-draw",
      storageBucket: "bus-seat-draw.firebasestorage.app",
      messagingSenderId: "272780096803",
      appId: "1:272780096803:web:6c1d45601b0f7299920896",
      measurementId: "G-K4QEHJSSNL"
    };

    // 初始化 Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const SEAT_LAYOUT = [
      { type: 'header' },
      { row: 1, seats: [{ id: '1-1' }, { id: '1-3' }, { id: 'driver_seat', type: 'driver', label: '車長' }] },
      { row: 2, seats: [{ id: '2-1' }, { id: '2-3' }, { id: '2-4' }, { id: '2-2' }] },
      { row: 3, seats: [{ id: '3-1' }, { id: '3-3' }, { id: '3-4' }, { id: '3-2' }] },
      { row: 4, seats: [{ id: '4-1' }, { id: '4-3' }, { id: '4-4' }, { id: '4-2' }] },
      { row: 5, seats: [{ id: '5-1' }, { id: '5-3' }, { id: '5-4' }, { id: '5-2' }] },
      { row: 6, seats: [{ id: '6-1' }, { id: '6-3' }, { id: '6-4' }, { id: '6-2' }] },
      { row: 7, seats: [{ id: '7-1', type: 'reserved', label: '7-1\n值班人員' }, { id: '7-3', type: 'reserved', label: '7-3\n值班人員' }, { id: '7-4' }, { id: '7-2' }] },
      { row: 8, seats: [{ id: '8-1', type: 'reserved', label: '8-1\n值班人員' }, { id: '8-3', type: 'reserved', label: '8-3\n值班人員' }, { id: '8-4' }, { id: '8-2' }] },
      { row: 9, seats: [{ id: 'safety_door', type: 'safety', label: '安全門' }, { id: '9-4' }, { id: '9-2' }] },
      { row: 10, seats: [{ id: '10-4' }, { id: '10-2' }] },
      { 
        row: 11, 
        isFullRow: true,
        seats: [
          { id: '11-1', type: 'free', label: '11-1\n自由座' },
          { id: '11-3', type: 'free', label: '11-3\n自由座' },
          { id: '11-5', type: 'free', label: '11-5\n自由座' },
          { id: '11-4', type: 'free', label: '11-4\n自由座' },
          { id: '11-2', type: 'free', label: '11-2\n自由座' }
        ] 
      }
    ];

    // 其他站上車（1~3排及4-1、4-3）
    const OTHER_STATIONS_SEATS = [
      '1-1', '1-3',
      '2-1', '2-3', '2-4', '2-2',
      '3-1', '3-3', '3-4', '3-2',
      '4-1', '4-3'
    ];

    // 東湖宿舍上車（5~10排及4-4、4-2）
    const DONGHU_DORM_SEATS = [
      '4-4', '4-2',
      '5-1', '5-3', '5-4', '5-2',
      '6-1', '6-3', '6-4', '6-2',
      '7-4', '7-2',
      '8-4', '8-2',
      '9-4', '9-2',
      '10-4', '10-2'
    ];

    function App() {
      const [name, setName] = React.useState('');
      const [location, setLocation] = React.useState('');
      const [assignedSeats, setAssignedSeats] = React.useState({});
      const [currentUser, setCurrentUser] = React.useState(null);
      const [isDrawing, setIsDrawing] = React.useState(false);
      const [animatingSeat, setAnimatingSeat] = React.useState('');
      const [showAdmin, setShowAdmin] = React.useState(false);
      const [adminPassword, setAdminPassword] = React.useState('');
      const [isAdmin, setIsAdmin] = React.useState(false);
      const [isOpen, setIsOpen] = React.useState(false); // 預設關閉抽籤

      React.useEffect(() => {
        // 監聽座位資料
        const unsubscribeSeats = db.collection('seats').onSnapshot(snapshot => {
          const seatsData = {};
          snapshot.forEach(doc => {
            seatsData[doc.id] = doc.data().passengerName;
          });
          setAssignedSeats(seatsData);
        });

        // 監聽系統開關狀態（預設關閉 false）
        const unsubscribeConfig = db.collection('settings').doc('config').onSnapshot(doc => {
          if (doc.exists) {
            setIsOpen(doc.data().isOpen ?? false);
          } else {
            // 初始化設為關閉
            db.collection('settings').doc('config').set({ isOpen: false });
            setIsOpen(false);
          }
        });

        const savedUser = localStorage.getItem('bus_passenger_name');
        if (savedUser) setCurrentUser(savedUser);

        return () => {
          unsubscribeSeats();
          unsubscribeConfig();
        };
      }, []);

      const mySeat = currentUser ? Object.keys(assignedSeats).find(seat => assignedSeats[seat] === currentUser) : null;

      const handleDraw = async () => {
        if (!isOpen) return alert('目前尚未開放抽籤，請等待管理員公告開放時間！');
        const trimmedName = name.trim();
        if (!trimmedName) return alert('請輸入您的姓名！');
        if (!location) return alert('請選擇您的上車地點！');

        const existingSeat = Object.keys(assignedSeats).find(seat => assignedSeats[seat] === trimmedName);
        if (existingSeat) {
          setCurrentUser(trimmedName);
          localStorage.setItem('bus_passenger_name', trimmedName);
          return alert(`您已經抽過座位了，您的交通車座位是：${existingSeat}`);
        }

        const locationName = location === 'donghu' ? '東湖宿舍' : '其他站';
        const confirmText = `【確認資料】\n姓名：${trimmedName}\n上車地點：${locationName}\n\n請確認以上資料是否正確？`;
        if (!confirm(confirmText)) return;

        const targetSeats = location === 'donghu' ? DONGHU_DORM_SEATS : OTHER_STATIONS_SEATS;
        const occupiedSeats = Object.keys(assignedSeats);
        const availableSeats = targetSeats.filter(seat => !occupiedSeats.includes(seat));

        if (availableSeats.length === 0) {
          return alert(`抱歉，【${locationName}】的所有可抽座位均已額滿！`);
        }

        setIsDrawing(true);
        let counter = 0;
        const interval = setInterval(() => {
          const tempSeat = availableSeats[Math.floor(Math.random() * availableSeats.length)];
          setAnimatingSeat(tempSeat);
          counter++;
          if (counter > 15) {
            clearInterval(interval);
            const finalSeat = availableSeats[Math.floor(Math.random() * availableSeats.length)];
            db.collection('seats').doc(finalSeat).set({ passengerName: trimmedName })
              .then(() => {
                setCurrentUser(trimmedName);
                localStorage.setItem('bus_passenger_name', trimmedName);
                setIsDrawing(false);
                setAnimatingSeat('');
              })
              .catch(err => {
                alert('抽籤發生錯誤，請重試！');
                setIsDrawing(false);
              });
          }
        }, 100);
      };

      const handleAdminLogin = () => {
        if (adminPassword === '1234') {
          setIsAdmin(true);
        } else {
          alert('密碼錯誤！');
        }
      };

      const toggleAdmin = () => {
        if (showAdmin) {
          setShowAdmin(false);
          setIsAdmin(false);
          setAdminPassword('');
        } else {
          setShowAdmin(true);
        }
      };

      const toggleSystemOpen = () => {
        const nextState = !isOpen;
        db.collection('settings').doc('config').set({ isOpen: nextState }, { merge: true })
          .then(() => alert(`抽籤系統已修改為：${nextState ? '【開放中】' : '【關閉中】'}`))
          .catch(() => alert('設定更新失敗！'));
      };

      const handleAdminSeatClick = (seatId, currentName) => {
        if (!isAdmin) return;

        const isDriver = seatId === 'driver_seat';
        const labelText = isDriver ? '車長座位' : `座位 ${seatId}`;

        if (currentName) {
          const action = prompt(`【管理員編輯 - ${labelText}】\n目前設定：${currentName}\n\n請選擇操作：\n1. 輸入「新姓名」直接修改\n2. 輸入「0」或留空刪除紀錄\n3. 點擊「取消」不變更`, currentName);
          if (action === null) return;
          
          const trimmedAction = action.trim();
          if (trimmedAction === '' || trimmedAction === '0') {
            db.collection('seats').doc(seatId).delete()
              .then(() => alert(`已清除 ${labelText} 的資料！`))
              .catch(() => alert('清除失敗！'));
          } else {
            db.collection('seats').doc(seatId).set({ passengerName: trimmedAction })
              .then(() => alert(`${labelText} 已更新為：${trimmedAction}`))
              .catch(() => alert('更新失敗！'));
          }
        } else {
          const newName = prompt(`【管理員新增 - ${labelText}】\n請輸入姓名：`);
          if (newName && newName.trim()) {
            db.collection('seats').doc(seatId).set({ passengerName: newName.trim() })
              .then(() => alert(`已成功設定 ${newName.trim()} 為 ${labelText}！`))
              .catch(() => alert('設定失敗！'));
          }
        }
      };

      const handleReset = async () => {
        if (confirm('【管理員操作】\n確定要清空「交通車」所有抽籤紀錄嗎？此動作無法復原！')) {
          const snapshot = await db.collection('seats').get();
          const batch = db.batch();
          snapshot.docs.forEach(doc => batch.delete(doc.ref));
          await batch.commit();
          alert('交通車所有座位紀錄已清空！');
        }
      };

      return (
        <div className="max-w-md mx-auto p-4 pb-20">
          <header className="text-center mb-6 bg-white p-4 rounded-xl shadow-md">
            <h1 className="text-2xl font-bold text-slate-800">🚌 交通車座位抽籤</h1>
            <div className="mt-2">
              <span className={`inline-block px-3 py-1 rounded-full text-xs font-bold ${isOpen ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                {isOpen ? '🟢 抽籤系統開放中' : '🔴 系統尚未開放抽籤'}
              </span>
            </div>
            <button 
              onClick={toggleAdmin}
              className="text-xs text-slate-400 mt-2 underline block mx-auto"
            >
              {showAdmin ? '關閉管理後台' : '管理員入口'}
            </button>
          </header>

          {showAdmin && (
            <div className="bg-amber-50 border border-amber-200 p-4 rounded-xl mb-6 space-y-3">
              {!isAdmin ? (
                <div className="flex gap-2">
                  <input 
                    type="password" 
                    placeholder="輸入後台密碼 (預設1234)" 
                    value={adminPassword} 
                    onChange={e => setAdminPassword(e.target.value)}
                    className="p-2 text-sm border rounded flex-1"
                  />
                  <button onClick={handleAdminLogin} className="bg-amber-600 text-white px-3 text-sm rounded">登入</button>
                </div>
              ) : (
                <div className="space-y-2">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-amber-900">管理員模式已啟用</h3>
                    <span className="text-xs text-amber-700 bg-amber-200 px-2 py-0.5 rounded">點擊座位/車長可新增、修改或刪除</span>
                  </div>
                  
                  {/* 開放 / 關閉切換按鈕 */}
                  <button 
                    onClick={toggleSystemOpen}
                    className={`w-full py-2.5 rounded text-xs font-bold text-white shadow transition-all ${
                      isOpen ? 'bg-rose-600 hover:bg-rose-700' : 'bg-emerald-600 hover:bg-emerald-700'
                    }`}
                  >
                    {isOpen ? '🔒 關閉抽籤系統' : '🔓 開放抽籤系統'}
                  </button>

                  <button onClick={handleReset} className="w-full bg-red-500 hover:bg-red-600 text-white text-xs py-2 rounded font-bold">
                    清空重置交通車所有座位
                  </button>
                </div>
              )}
            </div>
          )}

          {!mySeat ? (
            <div className="bg-white p-4 rounded-xl shadow-md mb-6 space-y-3">
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">1. 請選擇上車地點 <span className="text-red-500">*</span></label>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    disabled={!isOpen}
                    onClick={() => setLocation('donghu')}
                    className={`py-3 px-3 text-sm rounded-lg font-bold border transition-all ${
                      location === 'donghu' 
                        ? 'bg-blue-600 text-white border-blue-600 shadow' 
                        : 'bg-slate-50 text-slate-700 border-slate-300 hover:bg-slate-100'
                    } ${!isOpen && 'opacity-60 cursor-not-allowed'}`}
                  >
                    🏢 東湖宿舍
                  </button>
                  <button
                    type="button"
                    disabled={!isOpen}
                    onClick={() => setLocation('other')}
                    className={`py-3 px-3 text-sm rounded-lg font-bold border transition-all ${
                      location === 'other' 
                        ? 'bg-blue-600 text-white border-blue-600 shadow' 
                        : 'bg-slate-50 text-slate-700 border-slate-300 hover:bg-slate-100'
                    } ${!isOpen && 'opacity-60 cursor-not-allowed'}`}
                  >
                    🚏 其他站
                  </button>
                </div>
              </div>

              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">2. 請輸入姓名 <span className="text-red-500">*</span></label>
                <input 
                  type="text" 
                  value={name} 
                  onChange={e => setName(e.target.value)} 
                  placeholder="例如：張小明"
                  disabled={isDrawing || !isOpen}
                  className="w-full p-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-100 disabled:cursor-not-allowed"
                />
              </div>

              <button 
                onClick={handleDraw} 
                disabled={isDrawing || !name.trim() || !location || !isOpen}
                className="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-bold disabled:bg-slate-300 disabled:cursor-not-allowed shadow transition-all mt-2"
              >
                {!isOpen ? '暫未開放抽籤' : isDrawing ? '抽籤中...' : '開始抽籤'}
              </button>
            </div>
          ) : (
            <div className="bg-emerald-500 text-white p-4 rounded-xl shadow-md mb-6 text-center">
              <p className="text-sm">恭喜！{currentUser}</p>
              <p className="text-2xl font-black mt-1">您的交通車座位：{mySeat}</p>
            </div>
          )}

          {/* 車體地圖 */}
          <div className="bg-white p-4 rounded-2xl shadow-xl border-2 border-slate-300">
            <div className="flex justify-between items-center bg-slate-800 text-white py-2 px-4 rounded-lg mb-4 text-center font-bold">
              <span>司機駕駛 🚘</span>
              <span>車門 🚪</span>
            </div>

            <div className="space-y-2">
              {SEAT_LAYOUT.slice(1).map((row) => {
                if (row.isFullRow) {
                  return (
                    <div key={row.row} className="flex gap-1 w-full">
                      {row.seats.map(s => (
                        <SeatBox key={s.id} {...s} name={assignedSeats[s.id]} isAnim={animatingSeat === s.id} mySeat={mySeat} isAdmin={isAdmin} onAdminClick={handleAdminSeatClick} />
                      ))}
                    </div>
                  );
                }

                if (row.row === 9) {
                  return (
                    <div key="row-9-10" className="flex justify-between gap-2 items-stretch">
                      <div className="w-[48%] bg-amber-100 border-2 border-amber-400 rounded-lg flex items-center justify-center font-bold text-amber-800 text-center text-sm p-2">
                        🚨 安全門
                      </div>
                      <div className="w-[48%] space-y-2">
                        <div className="flex gap-1">
                          <SeatBox id="9-4" name={assignedSeats['9-4']} isAnim={animatingSeat === '9-4'} mySeat={mySeat} isAdmin={isAdmin} onAdminClick={handleAdminSeatClick} />
                          <SeatBox id="9-2" name={assignedSeats['9-2']} isAnim={animatingSeat === '9-2'} mySeat={mySeat} isAdmin={isAdmin} onAdminClick={handleAdminSeatClick} />
                        </div>
                        <div className="flex gap-1">
                          <SeatBox id="10-4" name={assignedSeats['10-4']} isAnim={animatingSeat === '10-4'} mySeat={mySeat} isAdmin={isAdmin} onAdminClick={handleAdminSeatClick} />
                          <SeatBox id="10-2" name={assignedSeats['10-2']} isAnim={animatingSeat === '10-2'} mySeat={mySeat} isAdmin={isAdmin} onAdminClick={handleAdminSeatClick} />
                        </div>
                      </div>
                    </div>
                  );
                }
                if (row.row === 10) return null;

                return (
                  <div key={row.row} className="flex justify-between gap-2">
                    <div className="flex gap-1 w-[48%]">
                      {row.seats.slice(0, 2).map(s => (
                        <SeatBox key={s.id} {...s} name={assignedSeats[s.id]} isAnim={animatingSeat === s.id} mySeat={mySeat} isAdmin={isAdmin} onAdminClick={handleAdminSeatClick} />
                      ))}
                    </div>
                    <div className="flex gap-1 w-[48%] justify-end">
                      {row.seats.slice(2).map(s => (
                        <SeatBox key={s.id} {...s} name={assignedSeats[s.id]} isAnim={animatingSeat === s.id} mySeat={mySeat} isAdmin={isAdmin} onAdminClick={handleAdminSeatClick} />
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    function SeatBox({ id, type, label, name, isAnim, mySeat, isAdmin, onAdminClick }) {
      if (type === 'driver') {
        const driverName = name || '';
        const isTaken = !!driverName;
        
        let driverStyle = "bg-gray-200 text-gray-600 border-gray-300";
        if (isAdmin) {
          driverStyle = isTaken 
            ? "bg-amber-100 border-amber-400 text-amber-900 cursor-pointer hover:bg-amber-200" 
            : "bg-indigo-50 border-indigo-300 text-indigo-800 cursor-pointer hover:bg-indigo-100 border-dashed border-2";
        } else if (isTaken) {
          driverStyle = "bg-indigo-100 border-indigo-300 text-indigo-900";
        }

        return (
          <div 
            onClick={() => isAdmin && onAdminClick(id, driverName)}
            title={isAdmin ? (isTaken ? "點擊修改或刪除車長姓名" : "點擊手動安排車長") : ""}
            className={`w-full h-12 border rounded flex flex-col items-center justify-center text-xs font-bold transition-all ${driverStyle}`}
          >
            <span className="font-semibold">{label}</span>
            <span className="text-[10px] truncate max-w-full px-1">
              {driverName ? `(${driverName})` : ''}
              {isAdmin && <span className="text-[8px] block text-amber-700">{isTaken ? '✏️修改' : '➕手動'}</span>}
            </span>
          </div>
        );
      }
      if (type === 'reserved') {
        return <div className="flex-1 h-12 bg-slate-200 border border-slate-300 rounded flex items-center justify-center text-[10px] text-center font-bold text-slate-500 whitespace-pre-line">{label}</div>;
      }
      if (type === 'free') {
        return <div className="flex-1 h-12 bg-blue-50 border border-blue-200 rounded flex items-center justify-center text-[10px] text-center font-bold text-blue-500 whitespace-pre-line">{label}</div>;
      }

      const isMine = mySeat === id;
      const isTaken = !!name;

      let style = "bg-emerald-50 border-emerald-300 text-emerald-800";
      if (isAnim) style = "bg-yellow-300 border-yellow-500 scale-105 shadow-md";
      else if (isMine) style = "bg-emerald-500 border-emerald-600 text-white font-bold ring-2 ring-emerald-300";
      else if (isTaken) {
        style = isAdmin 
          ? "bg-amber-100 border-amber-400 text-amber-900 cursor-pointer hover:bg-amber-200 transition-colors" 
          : "bg-slate-300 border-slate-400 text-slate-600";
      } else if (isAdmin) {
        style += " cursor-pointer hover:bg-emerald-100 transition-colors border-dashed border-2";
      }

      const handleClick = () => {
        if (isAdmin) {
          onAdminClick(id, name);
        }
      };

      return (
        <div 
          onClick={handleClick}
          title={isAdmin ? (isTaken ? "點擊修改或刪除此座位" : "點擊手動安排人員") : ""}
          className={`flex-1 h-12 border rounded flex flex-col items-center justify-center text-xs transition-all ${style}`}
        >
          <span className="font-semibold">{id}</span>
          <span className="text-[10px] truncate max-w-full px-1">
            {name || '可抽'}
            {isAdmin && <span className="text-[8px] block text-amber-700">{isTaken ? '✏️修改' : '➕手動'}</span>}
          </span>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
